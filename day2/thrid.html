<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Text Formatting Tags</h1>
    <b>Bold</b><BR>
    <strong>STRONG</strong><br>
    <i>italic</i>
    <sub>fff</sub>
    <sup>45</sup>

    <ul type="circle">
        <h1>unordered list</h1>
          <li>item1</li>
          <li>item2</li>
          <li>item3</li> 
          <li>item4</li> 
          <li>item5</li>
    </ul>
    <ul type="square">
        <h1>unordered list</h1>
          <li>item1</li>
          <li>item2</li>
          <li>item3</li> 
          <li>item4</li> 
          <li>item5</li>
    </ul>

    <ol type="A">
        <h1>ordered list </h1>
          <li>item1</li>
          <li>item2</li>
          <li>item3</li> 
          <li>item4</li> 
          <li>item5</li>
    </ol>

    <dl>
        <h1>Description list</h1>
        <dt>item1</dt>
        <dd>hello</dd>
         
    </dl>
    
</body>
</html>
