<head>

            div{

            }
            #parent1{

            }

                    width:120px;

            }
              #child3{
                    width:120px;
                    height:140px; 
                    margin-left: auto;
                    border: 3px solid black; 
                    display: flex;
                    justify-content: center;

                    }
