            border: 2px solid black;
        }
        table td,th{

<body>

        <tr>

        <tr>

        </tr>
        <tr>
            <td>4567</td>
        </tr>
        <tr>
            <th>Age</th>
            <td>23</td>
        </tr>

    </table>
    
</body>
</html>
