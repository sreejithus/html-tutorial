<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    /* Style for all h1 elements */
    h1 {
        color: #333;
        font-size: 28px;
        margin-bottom: 10px;
    }

    /* Style for all p elements */
    p {
        color: #666;
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 8px;
    }

    /* Style for elements with class "p" */
    .p {
        color: #0066cc;
        font-weight: bold;
        background-color: #f0f0f0;
        padding: 10px;
        border-left: 4px solid #0066cc;
    }
</style>
</head>
<body>





       <h1>heading1</h1>
      <p>paragraph1</p>
      <p class="p">paragraph2</p>
      <h1 class="p">heading2</h1>
      <p class="p">paragraph3</p>
      <p class="p">paragraph4</p>
      <p class="p">paragraph5</p>

      





    
</body>
</html>
